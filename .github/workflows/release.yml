name: Android Build & Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish signed release APK to GitHub Releases"
        required: false
        type: boolean
        default: true
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PCC_KEYSTORE_BASE64: ${{ secrets.PCC_KEYSTORE_BASE64 }}
      PCC_KEY_ALIAS: ${{ secrets.PCC_KEY_ALIAS }}
      PCC_STORE_PASSWORD: ${{ secrets.PCC_STORE_PASSWORD }}
      PCC_KEY_PASSWORD: ${{ secrets.PCC_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version and check release tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=.*"\K[^"]+' android/app/build.gradle.kts | tail -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=.*\?:\s*\K[0-9]+' android/app/build.gradle.kts | tail -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Failed to parse versionName/versionCode from android/app/build.gradle.kts"
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected PC Control ${VERSION_NAME} (${VERSION_CODE}), tag ${TAG}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists; bump versionName/versionCode in android/app/build.gradle.kts before publishing."
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Preinstalled Android SDK not found in ANDROID_HOME/ANDROID_SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          MISSING=()
          [ -d "$SDK/platform-tools" ] || MISSING+=("platform-tools")
          [ -d "$SDK/platforms/android-35" ] || MISSING+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || MISSING+=("build-tools;35.0.0")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Installing missing Android SDK packages: ${MISSING[*]}"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "${MISSING[@]}" >/dev/null
          else
            echo "All required Android SDK packages already preinstalled."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore signing keystore and google-services.json
        run: |
          umask 077
          DIR="$HOME/.config/pc-control"
          mkdir -p "$DIR"

          if [ -n "${PCC_KEYSTORE_BASE64:-}" ] && [ -n "${PCC_KEY_ALIAS:-}" ] && [ -n "${PCC_STORE_PASSWORD:-}" ] && [ -n "${PCC_KEY_PASSWORD:-}" ]; then
            printf '%s' "$PCC_KEYSTORE_BASE64" | base64 --decode > "$DIR/release.jks"
            {
              printf 'PCC_KEYSTORE=%q\n' "$DIR/release.jks"
              printf 'PCC_KEY_ALIAS=%q\n' "$PCC_KEY_ALIAS"
              printf 'PCC_STORE_PASSWORD=%q\n' "$PCC_STORE_PASSWORD"
              printf 'PCC_KEY_PASSWORD=%q\n' "$PCC_KEY_PASSWORD"
            } > "$DIR/keystore.env"
            chmod 600 "$DIR/release.jks" "$DIR/keystore.env"
            echo "PCC_KEYSTORE=$DIR/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
            keytool -list -keystore "$DIR/release.jks" -storepass "$PCC_STORE_PASSWORD" -alias "$PCC_KEY_ALIAS" >/dev/null
            echo "Release keystore restored and verified."
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
              echo "::error::publish_release=true requires PCC_KEYSTORE_BASE64, PCC_KEY_ALIAS, PCC_STORE_PASSWORD, and PCC_KEY_PASSWORD secrets."
              exit 1
            fi
            echo "Release keystore secrets not set; Gradle will fall back to debug signing."
          fi

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            chmod 600 android/app/google-services.json
            echo "google-services.json restored."
          else
            echo "GOOGLE_SERVICES_JSON not set; building without FCM google-services plugin."
          fi

      - name: Run unit tests and assemble release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-control-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          NOTES: ${{ inputs.notes }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          OUT="$(mktemp -d)"
          cp "$APK" "$OUT/pc-control.apk"
          SHA256=$(sha256sum "$OUT/pc-control.apk" | awk '{print $1}')
          SIZE=$(stat -c%s "$OUT/pc-control.apk")
          BUILT=$(date +%s)

          SHA256="$SHA256" SIZE="$SIZE" BUILT="$BUILT" python3 - <<'PY' > "$OUT/version.json"
          import json, os

          payload = {
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["SIZE"]),
              "built": int(os.environ["BUILT"]),
          }
          notes = os.environ.get("NOTES", "").strip()
          if notes:
              payload["releaseNotes"] = notes
          print(json.dumps(payload, indent=2))
          PY

          RELEASE_NOTES="${NOTES:-PC Control ${VERSION_NAME} (${VERSION_CODE}).}"
          gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "PC Control ${VERSION_NAME} (${VERSION_CODE})" \
            --notes "${RELEASE_NOTES}

          APK: \`pc-control.apk\` (signed with the release key; SHA-256: \`${SHA256}\`)." \
            "$OUT/pc-control.apk" \
            "$OUT/version.json"
