plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pcnative'
version = '1.0.0'

android {
  namespace "expo.modules.pcnative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // cams player: WebRTCModuleOptions + libwebrtc classes (react-native-webrtc exposes org.jitsi:webrtc as api)
  implementation project(":react-native-webrtc")
  // replay player: ExoPlayer + HLS (camrec's fMP4 playlists)
  implementation "androidx.media3:media3-exoplayer:1.11.1"
  implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
  implementation "androidx.biometric:biometric:1.1.0"
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.fragment:fragment-ktx:1.6.2"
  implementation platform("com.google.firebase:firebase-bom:35.1.0")
  implementation "com.google.firebase:firebase-messaging"
}
